<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Assignment Runner</title>
    <style>
      #assignment-frame {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        border: 0;
      }
    </style>
  </head>
  <body>
    <h1>JavaScript Assignment Runner</h1>

    <form id="assignment-form">
      <label for="assignment-number">Assignment number (1–6):</label>
      <input
        id="assignment-number"
        name="assignment-number"
        type="number"
        min="1"
        max="6"
        step="1"
        value="1"
        required
      />
      <button type="submit">Run Assignment</button>
    </form>

    <p id="status" role="status">Enter an assignment number and run it.</p>
    <p>Assignment output appears in the browser console.</p>

    <div id="runner"></div>

    <script>
      const form = document.getElementById("assignment-form");
      const numberInput = document.getElementById("assignment-number");
      const status = document.getElementById("status");
      const runner = document.getElementById("runner");

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const assignmentNumber = Number(numberInput.value);

        if (
          !Number.isInteger(assignmentNumber) ||
          assignmentNumber < 1 ||
          assignmentNumber > 6
        ) {
          status.textContent = "Enter a whole number from 1 to 6.";
          return;
        }

        const previousFrame = document.getElementById("assignment-frame");
        if (previousFrame) {
          previousFrame.remove();
        }

        const frame = document.createElement("iframe");
        frame.id = "assignment-frame";
        frame.title = `Assignment ${assignmentNumber} runner`;

        frame.onload = () => {
          const assignmentScript =
            frame.contentDocument.createElement("script");

          assignmentScript.src = `Assignment${assignmentNumber}.js`;

          assignmentScript.onerror = () => {
            status.textContent = `Could not load Assignment ${assignmentNumber}.js.`;
          };

          frame.contentDocument.body.appendChild(assignmentScript);
          status.textContent = `Running Assignment ${assignmentNumber}. Check the browser console for output.`;
        };

        frame.src = "about:blank";
        runner.appendChild(frame);
      });
    </script>
  </body>
</html>
